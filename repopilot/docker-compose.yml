services:
  db:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
      POSTGRES_DB: repopilot
    ports:
      - "5433:5432"
    volumes:
      - repopilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Reuses the same backend/.env you use for local dev (GEMINI_API_KEY, model choices).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Overrides whatever DATABASE_URL backend/.env has: inside the compose network the
      # database is "db" on its own port, not the 5433 host mapping. Values set here take
      # precedence over env_file.
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot@db:5432/repopilot
    ports:
      - "8000:8000"
    volumes:
      # BM25 indexes and cloned repos survive container rebuilds.
      - repopilot_data:/app/data
      # Local-folder ingestion reads the *container's* filesystem, so repos you want to
      # ingest must be visible inside it. HOST_REPOS points at a directory on your machine
      # (defaults to this repo's parent); browse to /repos in the ingest UI to reach it.
      - ${HOST_REPOS:-..}:/repos:ro
    # No `command:` override — the image's CMD already runs init_db.py then uvicorn.

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  repopilot_pgdata:
  repopilot_data:
