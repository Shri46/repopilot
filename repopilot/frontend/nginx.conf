server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns client-side routes (/dashboard etc.), so any unmatched path
    # must fall back to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent streams its steps over SSE. Without these, nginx buffers the whole
        # response and the UI sits on "thinking..." until the run finishes.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        # An agent run can legitimately take minutes on a large repo / slow model.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
